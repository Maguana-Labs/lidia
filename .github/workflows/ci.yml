name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    # macOS 26 (Tahoe) + Xcode 26 are required: SwiftData macros and the
    # Liquid Glass APIs are not available in older toolchains.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Packages/LidIAKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lidiakit:
    # The shared package is consumed by the iOS and watchOS apps, which the
    # SwiftPM build above does not cover.
    runs-on: macos-26
    strategy:
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=watchOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LidIAKit
        working-directory: Packages/LidIAKit
        run: xcodebuild build -scheme LidIAKit -destination '${{ matrix.destination }}' -skipPackagePluginValidation

  apple-apps:
    # iOS and watchOS are frozen but must keep compiling.
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - project: LidIAiOS/LidIAiOS.xcodeproj
            scheme: LidIAiOS
            destination: generic/platform=iOS
          - project: LidIAWatch/LidIAWatch.xcodeproj
            scheme: LidIAWatch
            destination: generic/platform=watchOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.scheme }}
        run: xcodebuild build -project '${{ matrix.project }}' -scheme '${{ matrix.scheme }}' -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation
