# Mirrors LidIAiOS.xcodeproj (which uses folder-synchronized groups, so new
# files under Sources/, Shared/ and Widgets/ need no project edits).
name: LidIAiOS
options:
  bundleIdPrefix: io.lidia
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

packages:
  LidIAKit:
    path: ../Packages/LidIAKit

# DEVELOPMENT_TEAM comes from Config/Signing.xcconfig, which includes the
# untracked Config/Local.xcconfig (see the README).
configFiles:
  Debug: ../Config/Signing.xcconfig
  Release: ../Config/Signing.xcconfig

targets:
  LidIAiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Resources/Assets.xcassets
        type: resource
    dependencies:
      - package: LidIAKit
        product: LidIAKit
      - package: LidIAKit
        product: LidIAIntelligence
      - package: LidIAKit
        product: LidIAAppIntents
      - target: LidIAWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lidia.ios
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/LidIAiOS.entitlements

  LidIAWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lidia.ios.widgets
        PRODUCT_NAME: LidIAWidgets
        INFOPLIST_FILE: Resources/Widgets-Info.plist
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
